# SonarQube Cloud project descriptor (per ADR 0022).
# Real values for sonar.organization and sonar.projectKey are configured in
# SonarQube Cloud and surfaced to CI via GitHub Actions; they are intentionally
# left as placeholders here so the file is committable without secrets.

sonar.organization=yzlaboratory
sonar.projectKey=yzlaboratory_alexandrea
sonar.projectName=alexandrea
sonar.host.url=https://sonarcloud.io

# --- Sources ---
# Frontend (TypeScript) and backend (Java) live side-by-side; SonarQube
# Cloud analyses both as one project against one quality gate (ADR 0022).
sonar.sources=frontend/src,backend/src/main/java
sonar.tests=frontend/src,backend/src/test/java
# Sonar's path matcher has no brace-group syntax ({ts,tsx}); that pattern
# silently matches nothing, so each extension needs its own alternative.
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,backend/src/test/java/**/*.java
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/dist/**,frontend/coverage/**,backend/build/**

# Java analyser needs compiled classes to do its full pass.
sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test
sonar.java.libraries=backend/build/sonar-libraries/*.jar

# --- Coverage ---
# Vitest emits LCOV to frontend/coverage/lcov.info (see vite.config.ts);
# JaCoCo emits XML to backend/build/reports/jacoco/test (see build.gradle.kts).
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml

# sonar.tests/sonar.exclusions don't stop the JS analyser from still treating
# colocated *.test.tsx files as coverage-requiring source (they surface with
# qualifier FIL, not UTS); exempt them from the coverage requirement directly.
sonar.coverage.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# --- Misc ---
sonar.sourceEncoding=UTF-8
