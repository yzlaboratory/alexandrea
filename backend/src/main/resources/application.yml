# Defaults that hold across every profile. Per-profile overrides live below.

# Token lifetimes are config-driven, not pinned in code. Each URL template
# points at the SPA route that posts the token back to the matching /api/auth
# endpoint.
alexandrea:
  auth:
    verification-token-ttl: 24h
    verification-url-template: http://localhost:5173/verify?token={token}
    reset-token-ttl: 1h
    reset-url-template: http://localhost:5173/reset-password?token={token}
    login-rate-limit:
      max-attempts: 10
      window: 15m
    mail-rate-limit:
      max-attempts: 5
      window: 1h

spring:
  application:
    name: alexandrea

  # The path defaults to ./data/alexandrea.db in dev and a mounted volume in
  # prod. WAL mode and a short busy timeout are appended to the URL so writers
  # don't block readers under the default journal mode.
  datasource:
    url: jdbc:sqlite:${ALEXANDREA_DB_PATH:./data/alexandrea.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite is a single-writer file. A small pool with a generous
      # acquisition timeout matches that without serialising every read.
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Schema init is off because Flyway (V2) owns that table, same as every
  # other table here.
  session:
    store-type: jdbc
    timeout: 30d
    jdbc:
      initialize-schema: never

server:
  port: 8080
  servlet:
    session:
      cookie:
        # Secure=true assumes prod terminates TLS at the edge; the dev profile
        # relaxes it so the app boots over http://localhost.
        http-only: true
        same-site: lax
        secure: true

management:
  endpoints:
    web:
      exposure:
        # Only the health probe is exposed by default. Metrics endpoints will
        # be added if/when an observability ADR opens them up.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    dev.yzlaboratory.alexandrea: INFO

---
spring:
  config:
    activate:
      on-profile: dev

server:
  servlet:
    session:
      cookie:
        # Dev runs over plain http on localhost; keep Secure off so the
        # cookie is actually issued.
        secure: false

logging:
  level:
    dev.yzlaboratory.alexandrea: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
# Prod inherits the defaults above.
